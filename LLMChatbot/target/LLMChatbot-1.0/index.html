<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Chatbot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .chat-container {
            width: 420px;
            height: 620px;
            backdrop-filter: blur(20px);
            background: rgba(255,255,255,0.15);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            padding: 15px;
            text-align: center;
            font-weight: bold;
            color: white;
            background: linear-gradient(to right, #ff512f, #dd2476);
        }

        .chat-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            color: white;
        }

        .msg {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 15px;
            margin-bottom: 10px;
            animation: fadeIn 0.3s ease-in-out;
            word-wrap: break-word;
        }

        .user {
            background: #00f2fe;
            color: black;
            align-self: flex-end;
            border-bottom-right-radius: 0;
        }

        .bot {
            background: #fbc2eb;
            color: black;
            align-self: flex-start;
            border-bottom-left-radius: 0;
        }

        .chat-input {
            display: flex;
            padding: 10px;
            background: rgba(0,0,0,0.2);
        }

        .chat-input input {
            flex: 1;
            border-radius: 20px;
            border: none;
            padding: 10px 15px;
        }

        .chat-input button {
            border-radius: 50%;
            width: 45px;
            height: 45px;
            margin-left: 8px;
            border: none;
            background: linear-gradient(45deg, #00f260, #0575e6);
            color: white;
            font-size: 18px;
        }

        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(5px);}
            to {opacity: 1; transform: translateY(0);}
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">✨ OpenAi ChatBot</div>
    <div id="chatBox" class="chat-box d-flex flex-column"></div>

    <div class="chat-input">
        <input id="msg" type="text" placeholder="Type something..." onkeydown="if(event.key==='Enter') send()">
        <button onclick="send()">➤</button>
    </div>
</div>

<script>
    function send() {
        let msg = document.getElementById("msg").value.trim();
        if (!msg) return;

        addMessage(msg, "user");

        fetch("chat", {
            method: "POST",
            headers: {"Content-Type": "application/x-www-form-urlencoded"},
            body: "message=" + encodeURIComponent(msg)
        })
            .then(res => res.text())
            .then(data => addMessage(data, "bot"));

        document.getElementById("msg").value = "";
    }

    function addMessage(text, cls) {
        let box = document.getElementById("chatBox");
        let div = document.createElement("div");
        div.className = "msg " + cls;
        div.innerText = text;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }
</script>

</body>
</html>
